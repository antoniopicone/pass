<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Signup</title></head>
<body>
<h1>Test Signup Page</h1>
<form id="signup-form">
  <label>Email <input type="email" id="email" name="email" autocomplete="username"></label><br>
  <label>New password <input type="password" id="password" name="password" autocomplete="new-password"></label><br>
  <label>Confirm password <input type="password" id="password2" name="password2" autocomplete="new-password"></label><br>
  <button type="submit">Sign up</button>
</form>
<script>
document.getElementById('signup-form').addEventListener('submit', (e) => {
  e.preventDefault();
  document.title = "SUBMITTED:" + document.getElementById('email').value + ":" + document.getElementById('password').value + ":" + document.getElementById('password2').value;
});
</script>
</body>
</html>
