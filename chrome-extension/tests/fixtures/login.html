<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Login</title></head>
<body>
<h1>Test Login Page</h1>
<form id="login-form">
  <label>Email <input type="email" id="email" name="email" autocomplete="username"></label><br>
  <label>Password <input type="password" id="password" name="password" autocomplete="current-password"></label><br>
  <button type="submit">Log in</button>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  document.title = "SUBMITTED:" + document.getElementById('email').value + ":" + document.getElementById('password').value;
});
</script>
</body>
</html>
