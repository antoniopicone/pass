 <!-- White-on-transparent variant of assets/icon.svg for the GNOME Shell
      top-bar indicator (see pass-gnome/src/tray.rs): status icons are
      conventionally a flat silhouette rather than the full-color app
      icon, so this keeps just the two key shapes (already white in the
